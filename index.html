<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f7a5c">
<link rel="apple-touch-icon" id="touch" href="">
<title>Финансы</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mut:#6b7280;--line:#e5e7eb;--acc:#1f7a5c;--red:#d64545;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1113;--card:#1a1e22;--tx:#eef0f2;--mut:#9aa3ad;--line:#2a3036;--acc:#3bb88f;--red:#ef6a6a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:cover}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.neg{color:var(--red)}.pos{color:var(--acc)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:var(--line);color:var(--tx)}
button.d{background:transparent;color:var(--red)}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
input[type=color]{padding:2px;height:46px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);font-size:12px;padding:6px 2px}
nav button.on{color:var(--acc)}
nav b{display:block;font-size:22px;line-height:1.1}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:29px;font-size:32px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:8px 2px;border-radius:12px;border:2px solid transparent;text-align:center;overflow:hidden}
.chip.on{border-color:var(--acc)}
.seg{display:flex;gap:8px}.seg button{flex:1}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mn button{padding:8px 14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='fin-v1';
const DEF={start:0,cats:[
{id:'c1',name:'Еда',color:'#e8833a',e:'🛒'},
{id:'c2',name:'Транспорт',color:'#3b82c4',e:'🚌'},
{id:'c3',name:'Развлечения',color:'#9b59b6',e:'🎮'},
{id:'c4',name:'Дом',color:'#2f9e8f',e:'🏠'},
{id:'c5',name:'Здоровье',color:'#d64545',e:'💊'},
{id:'c6',name:'Прочее',color:'#7a8793',e:'📦'}],tx:[]};
function migrate(d){if(!d.cards){d.cards=[{id:'k1',name:'Карта',start:d.start||0}];d.tx.forEach(t=>t.card='k1');delete d.start}return d}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
S=migrate(S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Не удалось сохранить данные')}};
let tab='home',month=new Date(),sheet=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2})+' р.';
const cat=id=>S.cats.find(c=>c.id===id)||{name:'Без категории',color:'#7a8793',e:'❔'};
const icon=c=>`<span class="ic" style="background:${c.color}33">${c.img?`<img src="${c.img}" alt="">`:esc(c.e||'❔')}</span>`;
const cardBal=id=>{const c=S.cards.find(x=>x.id===id);return (c?c.start:0)+S.tx.filter(t=>t.card===id).reduce((a,t)=>a+(t.type==='in'?t.amt:-t.amt),0)};
const balance=()=>S.cards.filter(c=>!c.excl).reduce((a,c)=>a+cardBal(c.id),0);
const cardName=id=>{const c=S.cards.find(x=>x.id===id);return c?c.name:'—'};
const inMonth=(t,m)=>{const d=new Date(t.ts);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()};
const uid=()=>Math.random().toString(36).slice(2,9);
const monthName=m=>m.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});

function render(){
  const a=$('#app');
  if(tab==='home')a.innerHTML=home();
  if(tab==='hist')a.innerHTML=hist();
  if(tab==='cats')a.innerHTML=cats();
  if(tab==='more')a.innerHTML=more();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
function monthNav(){return `<div class="mn"><button class="g" onclick="shift(-1)">‹</button><b style="text-transform:capitalize">${monthName(month)}</b><button class="g" onclick="shift(1)">›</button></div>`}
function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function home(){
  const mt=S.tx.filter(t=>inMonth(t,month));
  const out=mt.filter(t=>t.type==='out'),inc=mt.filter(t=>t.type==='in');
  const so=out.reduce((a,t)=>a+t.amt,0),si=inc.reduce((a,t)=>a+t.amt,0);
  const by={};out.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{const c=cat(id);
    return `<div class="item"><div class="row">${icon(c)}<div class="sp"><div class="row"><span class="sp">${esc(c.name)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/so*100}%;background:${c.color}"></i></div></div></div></div>`}).join('');
  return `<h1>Финансы</h1>
  <div class="card"><div class="mut">Общая сумма</div><div class="big">${money(balance())}</div></div>
  <div class="card"><div class="row" style="margin-bottom:4px"><b class="sp">Карты</b><button class="g" style="padding:0;width:30px;height:30px;font-size:20px;line-height:1;border-radius:15px" onclick="openCard()" aria-label="Добавить карту">+</button></div>${S.cards.map(k=>`<div class="item" onclick="openCard('${k.id}')"><div class="row">${icon({color:k.color||'#3b82c4',e:k.e||'💳',img:k.img})}<span class="sp">${esc(k.name)}${k.excl?'<br><span class="mut" style="font-size:12px">не входит в общую сумму</span>':''}</span><b>${money(cardBal(k.id))}</b><span class="mut">›</span></div></div>`).join('')}</div>
  ${monthNav()}
  <div class="card"><div class="row"><div class="sp"><div class="mut">Расходы</div><b class="neg" style="font-size:20px">${money(so)}</b></div><div class="sp"><div class="mut">Доходы</div><b class="pos" style="font-size:20px">${money(si)}</b></div></div></div>
  <div class="card"><b>По категориям</b>${rows||'<p class="mut">В этом месяце расходов нет</p>'}</div>
  <button class="fab" onclick="openTx()">+</button>`;
}
function hist(){
  const list=S.tx.filter(t=>inMonth(t,month)).sort((a,b)=>b.ts-a.ts);
  const h=list.map(t=>{const c=t.type==='in'?{name:'Доход',color:'#3bb88f',e:'💰'}:cat(t.cat);
    const d=new Date(t.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
    return `<div class="item"><div class="row">${icon(c)}<div class="sp"><div>${esc(t.note||c.name)}</div><div class="mut">${esc(c.name)} · ${esc(cardName(t.card))} · ${d}</div></div><b class="${t.type==='in'?'pos':'neg'}">${t.type==='in'?'+':'−'}${money(t.amt)}</b><button class="d" style="padding:6px" onclick="delTx('${t.id}')">✕</button></div></div>`}).join('');
  return `<h1>История</h1>${monthNav()}<div class="card">${h||'<p class="mut">Операций нет</p>'}</div><button class="fab" onclick="openTx()">+</button>`;
}
function cats(){
  return `<h1>Категории</h1><div class="card">${S.cats.map(c=>`<div class="item" onclick="openCat('${c.id}')"><div class="row">${icon(c)}<span class="sp">${esc(c.name)}</span><span style="width:18px;height:18px;border-radius:9px;background:${c.color}"></span><span class="mut">›</span></div></div>`).join('')}</div>
  <button style="width:100%" onclick="openCat()">+ Новая категория</button>`;
}
function more(){
  return `<h1>Ещё</h1><div class="card"><b>Резервная копия</b><p class="mut">Данные хранятся только на этом телефоне. Если удалить иконку или очистить данные Safari, они пропадут. Время от времени сохраняйте копию в «Файлы».</p>
  <div class="seg"><button onclick="exp()">Экспорт</button><button class="g" onclick="$('#imp').click()">Импорт</button></div>
  <input type="file" id="imp" accept="application/json" hidden onchange="imp(this)"></div>`;
}
function openSheet(html){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div>${html}</div>`;s.onclick=e=>{if(e.target===s)closeSheet()};document.body.appendChild(s);sheet=s}
function closeSheet(){if(sheet){sheet.remove();sheet=null}}

let draft;
function openTx(){draft={type:'out',cat:S.cats[0]&&S.cats[0].id,card:S.tx.length?S.tx[S.tx.length-1].card:S.cards[0].id};drawTx()}
function drawTx(keep){
  const v=keep||{};
  closeSheet();
  openSheet(`<div class="seg"><button class="${draft.type==='out'?'':'g'}" onclick="setType('out')">Расход</button><button class="${draft.type==='in'?'':'g'}" onclick="setType('in')">Доход</button></div>
  <label>Карта</label><select onchange="draft.card=this.value">${S.cards.map(k=>`<option value="${k.id}" ${draft.card===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select>
  <label>Сумма, р.</label><input id="amt" inputmode="decimal" placeholder="0" value="${esc(v.amt||'')}">
  ${draft.type==='out'?`<label>Категория</label><div class="grid">${S.cats.map(c=>`<div class="chip ${draft.cat===c.id?'on':''}" onclick="pickCat('${c.id}')">${icon(c)}<span>${esc(c.name)}</span></div>`).join('')}</div>`:''}
  <label>Заметка</label><input id="note" placeholder="Необязательно" value="${esc(v.note||'')}">
  <label>Дата</label><input id="dt" type="date" value="${v.dt||new Date().toISOString().slice(0,10)}">
  <button style="width:100%;margin-top:16px" onclick="addTx()">Добавить</button>`);
  if(!keep)setTimeout(()=>{const a=$('#amt');a&&a.focus()},50);
}
function snap(){return{amt:$('#amt').value,note:$('#note').value,dt:$('#dt').value}}
function setType(t){const s=snap();draft.type=t;drawTx(s)}
function pickCat(id){const s=snap();draft.cat=id;drawTx(s)}
function addTx(){
  const amt=parseFloat($('#amt').value.replace(',','.').replace(/\s/g,''));
  if(!(amt>0)){$('#amt').focus();return}
  const d=$('#dt').value?new Date($('#dt').value+'T12:00:00'):new Date();
  S.tx.push({id:uid(),card:draft.card,type:draft.type,cat:draft.type==='out'?draft.cat:null,amt,note:$('#note').value.trim(),ts:d.getTime()});
  save();closeSheet();render();
}
function delTx(id){if(confirm('Удалить операцию?')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}
function resizeImg(f,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=96,cv=document.createElement('canvas');cv.width=cv.height=s;
    const m=Math.min(im.width,im.height),x=(im.width-m)/2,y=(im.height-m)/2;
    cv.getContext('2d').drawImage(im,x,y,m,m,0,0,s,s);
    cb(cv.toDataURL('image/jpeg',.8))};im.src=r.result};
  r.readAsDataURL(f);
}
let kd;
function openCard(id){
  const k=id?S.cards.find(x=>x.id===id):null;
  kd={id:id||null,name:k?k.name:'',bal:k?Math.round(cardBal(id)*100)/100:0,color:(k&&k.color)||'#3b82c4',e:k?(k.e||'💳'):'💳',excl:!!(k&&k.excl)};
  if(k&&k.img)kd.img=k.img;
  drawCard();
}
function drawCard(){
  closeSheet();
  openSheet(`<b>${kd.id?'Карта':'Новая карта'}</b>
  <label>Название</label><input id="kn" value="${esc(kd.name)}" placeholder="Например, Зарплатная">
  <label>${kd.id?'Сколько сейчас на карте, р.':'Текущий остаток, р.'}</label><input id="kb" inputmode="decimal" value="${esc(kd.bal)}">
  <label>Цвет</label><input id="kc" type="color" value="${kd.color}">
  <label>Эмодзи</label><input id="ke" value="${esc(kd.e||'')}" maxlength="4">
  <label>Или своя картинка</label>
  <div class="row">${icon({color:kd.color,e:kd.e,img:kd.img})}<button class="g" onclick="$('#kf').click()">Выбрать фото</button>${kd.img?'<button class="d" onclick="noKImg()">Убрать</button>':''}</div>
  <input type="file" id="kf" accept="image/*" hidden onchange="pickKImg(this)">
  <label style="display:flex;align-items:center;gap:10px;color:var(--tx);font-size:16px;margin-top:16px"><input type="checkbox" id="kx" style="width:22px;height:22px;flex:none" ${kd.excl?'checked':''}>Не учитывать в общей сумме</label>
  <div class="seg" style="margin-top:18px"><button onclick="saveCard()">Сохранить</button>${kd.id&&S.cards.length>1?'<button class="g neg" onclick="delCard()">Удалить</button>':''}</div>`);
}
function keepCard(){kd.name=$('#kn').value;kd.bal=$('#kb').value;kd.color=$('#kc').value;kd.e=$('#ke').value;kd.excl=$('#kx').checked}
function noKImg(){keepCard();delete kd.img;drawCard()}
function pickKImg(inp){const f=inp.files[0];if(!f)return;keepCard();resizeImg(f,u=>{kd.img=u;drawCard()})}
function saveCard(){
  keepCard();
  const name=kd.name.trim();
  const v=parseFloat(String(kd.bal).replace(',','.').replace(/\s/g,''));
  if(!name){$('#kn').focus();return}
  if(isNaN(v)){$('#kb').focus();return}
  const o={name,color:kd.color,e:kd.e||'💳'};
  if(kd.img)o.img=kd.img;if(kd.excl)o.excl=true;
  if(kd.id){const i=S.cards.findIndex(x=>x.id===kd.id),old=S.cards[i];o.id=old.id;o.start=old.start+v-cardBal(old.id);S.cards[i]=o}
  else{o.id=uid();o.start=v;S.cards.push(o)}
  save();closeSheet();render();
}
function delCard(){if(confirm('Удалить карту вместе со всеми её операциями?')){S.tx=S.tx.filter(t=>t.card!==kd.id);S.cards=S.cards.filter(c=>c.id!==kd.id);save();closeSheet();render()}}
let cd;
function openCat(id){
  cd=id?{...cat(id),id}:{id:null,name:'',color:'#3b82c4',e:'⭐'};
  drawCat();
}
function drawCat(){
  closeSheet();
  openSheet(`<b>${cd.id?'Категория':'Новая категория'}</b>
  <label>Название</label><input id="cn" value="${esc(cd.name)}">
  <label>Цвет</label><input id="cc" type="color" value="${cd.color}">
  <label>Эмодзи</label><input id="ce" value="${esc(cd.e||'')}" maxlength="4">
  <label>Или своя картинка</label>
  <div class="row">${icon({color:cd.color,e:cd.e,img:cd.img})}<button class="g" onclick="$('#cf').click()">Выбрать фото</button>${cd.img?'<button class="d" onclick="noImg()">Убрать</button>':''}</div>
  <input type="file" id="cf" accept="image/*" hidden onchange="pickImg(this)">
  <div class="seg" style="margin-top:18px"><button onclick="saveCat()">Сохранить</button>${cd.id?'<button class="g neg" onclick="delCat()">Удалить</button>':''}</div>`);
}
function keepCat(){cd.name=$('#cn').value;cd.color=$('#cc').value;cd.e=$('#ce').value}
function noImg(){keepCat();delete cd.img;drawCat()}
function pickImg(inp){
  const f=inp.files[0];if(!f)return;keepCat();
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=96,cv=document.createElement('canvas');cv.width=cv.height=s;
    const m=Math.min(im.width,im.height),x=(im.width-m)/2,y=(im.height-m)/2;
    cv.getContext('2d').drawImage(im,x,y,m,m,0,0,s,s);
    cd.img=cv.toDataURL('image/jpeg',.8);drawCat()};im.src=r.result};
  r.readAsDataURL(f);
}
function saveCat(){
  keepCat();
  if(!cd.name.trim()){$('#cn').focus();return}
  const o={id:cd.id||uid(),name:cd.name.trim(),color:cd.color,e:cd.e||'❔'};
  if(cd.img)o.img=cd.img;
  const i=S.cats.findIndex(c=>c.id===o.id);
  if(i>=0)S.cats[i]=o;else S.cats.push(o);
  save();closeSheet();render();
}
function delCat(){if(confirm('Удалить категорию? Старые траты останутся без категории.')){S.cats=S.cats.filter(c=>c.id!==cd.id);save();closeSheet();render()}}
function exp(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='finance-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function imp(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!Array.isArray(d.cats)||!Array.isArray(d.tx))throw 0;
    if(confirm('Заменить текущие данные импортированными?')){S=migrate(d);save();render()}}catch(e){alert('Файл не похож на копию данных')}};
  r.readAsText(f);
}
document.body.insertAdjacentHTML('beforeend',`<nav>
<button data-t="home" onclick="tab='home';render()"><b>🏠</b>Главная</button>
<button data-t="hist" onclick="tab='hist';render()"><b>📋</b>История</button>
<button data-t="cats" onclick="tab='cats';render()"><b>🎨</b>Категории</button>
<button data-t="more" onclick="tab='more';render()"><b>⚙️</b>Ещё</button></nav>`);
render();
// иконка для экрана «Домой»
try{const cv=document.createElement('canvas');cv.width=cv.height=180;const g=cv.getContext('2d');
g.fillStyle='#1f7a5c';g.fillRect(0,0,180,180);g.fillStyle='#fff';g.font='bold 110px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('р.',90,95);
$('#touch').href=cv.toDataURL('image/png')}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
